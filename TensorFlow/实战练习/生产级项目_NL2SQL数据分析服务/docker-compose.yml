# 一键起：NL2SQL 服务 + MySQL + Ollama(LLM 后端)。 docker compose up --build
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      APP_ENV: prod
      APP_DATABASE_URL: mysql+pymysql://shop:shop@mysql:3306/shop
      APP_LLM_BACKEND: openai
      APP_OPENAI_BASE_URL: http://ollama:11434/v1
      APP_OPENAI_MODEL: qwen2.5:0.5b
      APP_OPENAI_API_KEY: ollama
    depends_on: [mysql, ollama]

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop
      MYSQL_USER: shop
      MYSQL_PASSWORD: shop
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
    # 起来后：docker compose exec ollama ollama pull qwen2.5:0.5b

  # 生产大规模可把 ollama 换成 vLLM(GPU)：
  # vllm:
  #   image: vllm/vllm-openai:latest
  #   command: --model Qwen/Qwen2.5-7B-Instruct --served-model-name qwen

volumes:
  mysql_data:
  ollama_data:

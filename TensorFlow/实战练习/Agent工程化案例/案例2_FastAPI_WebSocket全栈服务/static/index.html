<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent 研究助手 · 全栈流式</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #1a1a2e; }
    h1 { font-size: 20px; }
    .row { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    button { padding: 10px 18px; border: none; border-radius: 8px; background: #4f46e5; color: #fff; font-size: 15px; cursor: pointer; }
    button:disabled { background: #aaa; }
    #progress { margin: 16px 0; color: #666; font-size: 14px; }
    #progress div { padding: 2px 0; }
    #answer { padding: 16px; background: #f5f5fb; border-radius: 10px; min-height: 40px; white-space: pre-wrap; line-height: 1.6; }
    #sources { margin-top: 12px; font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <h1>🔎 Agent 研究助手（FastAPI + WebSocket 流式）</h1>
  <div class="row">
    <input id="q" placeholder="问点什么，例如：什么是混合检索" value="什么是混合检索">
    <button id="go" onclick="run()">研究</button>
  </div>
  <div id="progress"></div>
  <div id="answer"></div>
  <div id="sources"></div>

  <script>
    function run() {
      const q = document.getElementById('q').value.trim();
      if (!q) return;
      const prog = document.getElementById('progress');
      const ans = document.getElementById('answer');
      const src = document.getElementById('sources');
      const btn = document.getElementById('go');
      prog.innerHTML = ''; ans.textContent = ''; src.textContent = ''; btn.disabled = true;

      // 连后端 WebSocket（同源）
      const ws = new WebSocket(`ws://${location.host}/ws/research`);
      ws.onopen = () => ws.send(JSON.stringify({ query: q }));
      ws.onmessage = (e) => {
        const m = JSON.parse(e.data);
        if (m.type === 'progress') prog.innerHTML += `<div>· ${m.step}</div>`;
        else if (m.type === 'sources') src.textContent = '资料来源：' + m.data.join(' ｜ ');
        else if (m.type === 'token') ans.textContent += m.data;   // 逐字追加（打字机）
        else if (m.type === 'done') { btn.disabled = false; ws.close(); }
      };
      ws.onerror = () => { prog.innerHTML += '<div>⚠ 连接出错</div>'; btn.disabled = false; };
    }
  </script>
</body>
</html>

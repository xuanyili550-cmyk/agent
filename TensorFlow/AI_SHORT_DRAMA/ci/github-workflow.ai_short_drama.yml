# AI_SHORT_DRAMA 的 CI：lint + 全量测试（mock LLM、dummy 生成器、SQLite、eager 队列，不需要密钥/GPU）。
# 本仓库里 TensorFlow/AI_SHORT_DRAMA 是子目录，所以 working-directory 指进去；只有该目录改动才触发。
name: ai-short-drama

on:
  push:
    paths: ["TensorFlow/AI_SHORT_DRAMA/**", ".github/workflows/ai_short_drama.yml"]
  pull_request:
    paths: ["TensorFlow/AI_SHORT_DRAMA/**", ".github/workflows/ai_short_drama.yml"]

defaults:
  run:
    working-directory: TensorFlow/AI_SHORT_DRAMA

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            TensorFlow/AI_SHORT_DRAMA/requirements.txt
            TensorFlow/AI_SHORT_DRAMA/13_INFRA/requirements-infra.txt
      - name: 系统依赖（ffmpeg 带 libass，中文字体）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk libgl1
      - name: Python 依赖（CPU 版 torch，不装 CUDA）
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r 13_INFRA/requirements-infra.txt ruff
      - name: Lint
        run: python -m ruff check .
      - name: 测试
        run: python -m pytest --tb=short
      - name: Alembic 迁移可从零应用
        run: cd 13_INFRA/database && DATABASE_URL=sqlite:////tmp/migrate_check.db alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: 构建 API 镜像（不含 ML 依赖）
        run: docker build -f TensorFlow/AI_SHORT_DRAMA/13_INFRA/docker/Dockerfile --build-arg INSTALL_ML=0 -t ai-short-drama:ci TensorFlow/AI_SHORT_DRAMA
      - name: 镜像内能 import 全部队列任务
        run: docker run --rm -e API_KEYS=ci -e CELERY_BROKER_URL=memory:// -e DATABASE_URL=sqlite:///:memory: ai-short-drama:ci python -c "import importlib; importlib.import_module('13_INFRA.workers.celery_app'); importlib.import_module('13_INFRA.api.main'); print('ok')"

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Requires the FastAPI app to expose a /metrics endpoint, e.g. via
  # `prometheus-fastapi-instrumentator` (not wired up yet -- add it in 13_INFRA/api/main.py
  # once request-latency metrics are needed).
  - job_name: "api"
    static_configs:
      - targets: ["api:8000"]

  # Requires each celery worker container to run a `celery-exporter` (or the Flower
  # /metrics endpoint) sidecar; not included in docker-compose.yml yet, since none of
  # the GPU worker task bodies (07_GENERATION integration) are implemented yet either.
  - job_name: "celery"
    static_configs:
      - targets: ["celery-exporter:9808"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
